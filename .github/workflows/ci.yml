name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit, data, model, API and integration tests
        run: python -m pytest -v

      - name: Dependency vulnerability scan (report only)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements-api.txt

      - name: Static security scan of the source (report only)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r src -ll

  docker:
    name: Build, smoke-test and publish the image
    needs: quality          # skipped automatically if lint or tests fail
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch the trained model with DVC
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pip install dvc
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USER"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          dvc pull artifacts/model.joblib

      - name: Build the image
        run: docker build -f docker/Dockerfile.api -t sentiment-api:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 sentiment-api:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/health
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "A wonderful, moving film"}' | tee response.json
          grep -q '"label"' response.json

      - name: Show container logs on failure
        if: failure()
        run: docker logs api

      - name: Image vulnerability scan with Trivy (report only)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed sentiment-api:ci

      - name: Publish the image to GitHub Container Registry (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag sentiment-api:ci ghcr.io/$OWNER/mlops-sentiment-api:${{ github.sha }}
          docker tag sentiment-api:ci ghcr.io/$OWNER/mlops-sentiment-api:latest
          docker push ghcr.io/$OWNER/mlops-sentiment-api:${{ github.sha }}
          docker push ghcr.io/$OWNER/mlops-sentiment-api:latest