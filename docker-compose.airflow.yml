# Free local orchestration stack. Start after the standalone KFP UI is port-forwarded
# on the host at 127.0.0.1:8081 (see README).
services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow-local
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 15

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: sentiment-airflow:local
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow-local@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      KFP_HOST: ${KFP_HOST:-http://host.docker.internal:8081}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://host.docker.internal:5000}
      PYTHONPATH: /opt/airflow/project
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username airflow --password airflow --firstname Local --lastname Admin --role Admin --email airflow@local.invalid || true"
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags:ro
      - ./pipelines/kubeflow:/opt/airflow/project/pipelines/kubeflow:ro

  airflow-webserver:
    image: sentiment-airflow:local
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    volumes: &airflow-volumes
      - ./pipelines/airflow/dags:/opt/airflow/dags:ro
      - ./pipelines/kubeflow:/opt/airflow/project/pipelines/kubeflow:ro
      - ./artifacts:/opt/airflow/project/artifacts
      - ./logs:/opt/airflow/project/logs:ro
      - ./data/processed:/opt/airflow/project/data/processed:ro

  airflow-scheduler:
    image: sentiment-airflow:local
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    command: scheduler
    volumes: *airflow-volumes

volumes:
  airflow-db-data:
