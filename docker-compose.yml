# Local multi-container setup: API, MLflow (+Postgres) and monitoring (Prometheus, Pushgateway, Grafana).
# Secrets come from a git-ignored .env file (see .env.example). All ports are bound to 127.0.0.1.
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: sentiment-api:local
    ports:
      - "127.0.0.1:8000:8000"   # reachable from this machine only
    environment:
      MODEL_SOURCE: file
      PREDICTION_LOG_PATH: /app/logs/predictions.jsonl   # features only, never the review text
    volumes:
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - api-net

  mlflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow-local}
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - mlflow-net

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: sentiment-mlflow:local
    depends_on:
      mlflow-db:
        condition: service_healthy
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:-mlflow-local}@mlflow-db:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - mlflow-net

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"   # no login by default, so keep it local
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - pushgateway
    restart: unless-stopped
    networks:
      - api-net
      - monitoring-net

  pushgateway:
    image: prom/pushgateway:v1.11.1
    ports:
      - "127.0.0.1:9091:9091"
    restart: unless-stopped
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring-net

volumes:
  mlflow-db-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:

networks:
  api-net:
  mlflow-net:
  monitoring-net:
