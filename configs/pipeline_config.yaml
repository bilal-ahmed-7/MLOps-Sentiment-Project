# Dataset and pipeline configuration.
# Change dataset-specific names HERE, not in the code.

data:
  raw_path: data/raw/imdb_reviews.csv   # rename the downloaded CSV to this
  processed_dir: data/processed
  text_column: review                   # Kaggle "IMDB Dataset of 50K Movie Reviews"
  label_column: sentiment
  label_map:                            # label text -> numeric class
    negative: 0
    positive: 1

validation:
  min_text_length: 5                    # characters, after stripping whitespace
  expected_min_rows: 1000               # fail if the file is suspiciously small

preprocessing:
  random_seed: 42                       # fixed so every run gives the same split
  test_size: 0.15                       # fraction of ALL rows
  val_size: 0.15                        # fraction of ALL rows